<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="初中学习工作台 - 分科闯关、知识要点、语音朗读、单元测试">
<title>学习工作台 · 初中闯关</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111'/><text y='68' x='50' font-size='54' text-anchor='middle' fill='%23fff' font-family='sans-serif'>学</text></svg>">
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <button class="tb-back" id="btnBack" aria-label="返回">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="tb-brand" id="tbBrand">
      <span class="tb-logo">学</span>
      <span class="tb-title" id="tbTitle">学习工作台</span>
    </div>
    <div class="tb-right">
      <div class="tb-xp" id="tbXp" title="累计经验值">
        <span class="tb-lv" id="tbLv">Lv.1</span>
        <span class="tb-xpnum" id="tbXpNum">0 XP</span>
      </div>
    </div>
  </div>
</header>

<main id="view" class="view"></main>

<!-- 底部导航 -->
<nav class="tabbar" id="tabbar">
  <button id="navHome" data-route="/"><span class="ti">🏠</span><span>首页</span></button>
  <button id="navSubjects" data-route="/subjects"><span class="ti">📚</span><span>学科</span></button>
  <button id="navAch" data-route="/achievements"><span class="ti">🏅</span><span>成就</span></button>
  <button id="navMine" data-route="/mine"><span class="ti">👤</span><span>我的</span></button>
</nav>

<div class="toast" id="toast"></div>

<!-- 悬浮朗读控制条 -->
<div class="speakbar" id="speakbar">
  <button class="sb-btn" id="sbToggle" aria-label="暂停/继续">暂停</button>
  <div class="sb-text" id="sbText">正在朗读…</div>
  <button class="sb-btn sb-stop" id="sbStop" aria-label="停止">停止</button>
</div>

<script src="data/manifest.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/speech.js"></script>
<script src="assets/js/quiz.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
